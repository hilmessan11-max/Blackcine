version: '3.8'

services:
  # Backend Laravel
  app:
    build:
      context: ./Blackcine-Backend
      dockerfile: Dockerfile
    container_name: blackcine-api
    restart: unless-stopped
    ports:
      - "8000:9000"
    volumes:
      - ./Blackcine-Backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=blackcine
      - DB_USERNAME=${DB_USERNAME:-blackcine}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - FRONTEND_URL=http://localhost:8080
    depends_on:
      - mysql
      - redis
    networks:
      - blackcine

  # Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: blackcine-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Blackcine-Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - blackcine

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: blackcine-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=blackcine
      - MYSQL_USER=${DB_USERNAME:-blackcine}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blackcine
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (cache + sessions)
  redis:
    image: redis:7-alpine
    container_name: blackcine-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - blackcine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Queue Worker
  queue:
    build:
      context: ./Blackcine-Backend
      dockerfile: Dockerfile
    container_name: blackcine-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./Blackcine-Backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=blackcine
      - DB_USERNAME=${DB_USERNAME:-blackcine}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blackcine

volumes:
  mysql_data:
  redis_data:

networks:
  blackcine:
    driver: bridge
